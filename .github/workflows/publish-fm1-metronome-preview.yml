name: Publish FM1 Sampler 0.41 full-screen LOOP/SONG signed preview

on:
  push:
    branches: [feature/16-looper-metronome-monitor]
    paths:
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/**'
      - 'android/app/src/main/cpp/**'
      - 'android/app/src/test/java/**'
      - 'engine/**'
      - 'firmware/app/ctrl.c'
      - 'firmware/hosttest/ctrl_host.c'
      - '.github/workflows/publish-fm1-metronome-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm1-metronome-preview-release
  cancel-in-progress: true

jobs:
  publish-metronome-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check sampler regression tests
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
          ./engine/build/test_app
      - name: Test ADB TAR and FMP2 recovery tool
        run: |
          python3 -m py_compile tools/FM1_ADB_Recuperacion_0389.py
          python3 -m unittest discover -s tools -p 'test_adb_recovery.py' -v
      - name: Verify USB MIDI controller octave chord
        run: |
          mkdir -p firmware/build/host
          cc -std=c11 -O2 -DFM1_HOST_TEST -I firmware/sdk/include -I firmware/app -I firmware/app/synth \
            firmware/hosttest/ctrl_host.c -lm -o firmware/build/host/ctrl_host
          ./firmware/build/host/ctrl_host
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify FM1-SAMPLER whole-library backup and safe restore
        run: |
          mkdir -p /tmp/fm1-backup-java-test
          javac -d /tmp/fm1-backup-java-test \
            android/app/src/main/java/com/ferluht/fm1sampler/LibraryBackupArchive.java \
            android/app/src/main/java/com/ferluht/fm1sampler/PackDeletion.java \
            android/app/src/test/java/com/ferluht/fm1sampler/LibraryBackupArchiveHostTest.java \
            android/app/src/test/java/com/ferluht/fm1sampler/PackDeletionHostTest.java
          java -cp /tmp/fm1-backup-java-test com.ferluht.fm1sampler.LibraryBackupArchiveHostTest
          java -cp /tmp/fm1-backup-java-test com.ferluht.fm1sampler.PackDeletionHostTest
      - name: Install Android toolchain
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # A random runner debug key would make the next preview impossible to
      # update in place. Never publish if the owner has not installed a stable
      # private keystore in Actions Secrets (see docs/UPDATES_WITHOUT_DATA_LOSS.md).
      - name: Require permanent APK signing identity
        env:
          FM1_SIGNING_STORE_B64: ${{ secrets.FM1_SIGNING_STORE_B64 }}
          FM1_SIGNING_STORE_PASSWORD: ${{ secrets.FM1_SIGNING_STORE_PASSWORD }}
          FM1_SIGNING_KEY_ALIAS: ${{ secrets.FM1_SIGNING_KEY_ALIAS }}
          FM1_SIGNING_KEY_PASSWORD: ${{ secrets.FM1_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$FM1_SIGNING_STORE_B64" ] || [ -z "$FM1_SIGNING_STORE_PASSWORD" ] || \
             [ -z "$FM1_SIGNING_KEY_ALIAS" ] || [ -z "$FM1_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets not configured. Refusing to publish incompatible APK. See docs/UPDATES_WITHOUT_DATA_LOSS.md"
            exit 1
          fi
          umask 077
          printf '%s' "$FM1_SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/fm1-updates.jks"
          test -s "$RUNNER_TEMP/fm1-updates.jks"
      - name: Compile installable signed APK
        working-directory: android
        env:
          FM1_SIGNING_STORE_FILE: ${{ runner.temp }}/fm1-updates.jks
          FM1_SIGNING_STORE_PASSWORD: ${{ secrets.FM1_SIGNING_STORE_PASSWORD }}
          FM1_SIGNING_KEY_ALIAS: ${{ secrets.FM1_SIGNING_KEY_ALIAS }}
          FM1_SIGNING_KEY_PASSWORD: ${{ secrets.FM1_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify persistent signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.FM1_SIGNING_CERT_SHA256 || secrets.FM1_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Set FM1_SIGNING_CERT_SHA256 (Actions Variable or Secret) to the public signing-certificate SHA-256 before publishing"
            exit 1
          fi
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          got=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" |
                 sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          want=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          got=$(printf '%s' "$got" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::Signing certificate changed. Prevented a data-risking APK release."
            exit 1
          fi
          echo "Signing identity verified against pinned certificate SHA-256."

      - name: Verify compatible upgrade package identity and new version
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          info=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1)
          echo "$info"
          if [[ "$info" != *"name='com.ferluht.fm1sampler.scenes'"* ]] || \
             [[ "$info" != *"versionCode='65'"* ]]; then
            echo "::error::APK package or version changed; refusing to publish an incompatible upgrade"
            exit 1
          fi
      - name: Stage and check APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1-Sampler-LoopSong-Fullscreen-0.41-signed-preview.apk
          unzip -t dist/FM1-Sampler-LoopSong-Fullscreen-0.41-signed-preview.apk | tail -n 1
          sha256sum dist/FM1-Sampler-LoopSong-Fullscreen-0.41-signed-preview.apk
      - name: Upload pinned-certificate APK as test-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Sampler-0.41-LoopSong-Signed-Preview
          path: dist/FM1-Sampler-LoopSong-Fullscreen-0.41-signed-preview.apk
          if-no-files-found: error

      - name: Publish signed 0.41 preview as a GitHub pre-release
        id: publish_release
        # The repo may forbid Releases writes by GITHUB_TOKEN even when
        # contents:write is requested. A verified Actions APK remains usable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FM1_RELEASE_TOKEN || github.token }}
          TAG: v0.41-loopsong-preview.1
        run: |
          set -euo pipefail
          apk=dist/FM1-Sampler-LoopSong-Fullscreen-0.41-signed-preview.apk
          test -s "$apk"
          test -s docs/RELEASE_NOTES_041.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file docs/RELEASE_NOTES_041.md --title "FM1 Sampler 0.41.0 — Full-screen LOOP and SONG (Android Preview)" --prerelease
          else
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FM1 Sampler 0.41.0 — Full-screen LOOP and SONG (Android Preview)" --notes-file docs/RELEASE_NOTES_041.md --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease --jq '{url: .url, isPrerelease: .isPrerelease, files: [.assets[].name]}'
      - name: Signed APK artifact is the fallback when Releases is forbidden
        if: steps.publish_release.outcome == 'failure'
        run: |
          echo "::warning::GitHub Releases rejected this workflow's token. Signed APK build, compatibility checks, and artifact upload succeeded."
          echo "::warning::Download FM1-Sampler-0.41-LoopSong-Signed-Preview from the Artifacts section of this workflow run."
          echo "## Signed APK built successfully — GitHub Releases permission blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Releases returned an authorization failure. This does **not** invalidate the signed APK." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **FM1-Sampler-0.41-LoopSong-Signed-Preview** artifact (ZIP containing APK) in this run." >> "$GITHUB_STEP_SUMMARY"
          echo "To publish a permanent release, configure a repository Actions token with Releases/Contents write permission (or a scoped FM1_RELEASE_TOKEN secret), then rerun." >> "$GITHUB_STEP_SUMMARY"
